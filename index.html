<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickSearch</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="shortcut icon" href="/logo.png">
    <style>
        body {
            font-family: monospace, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 40px auto;
            max-width: 650px;
            padding: 0 10px;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: bold;
            color: #6a0dad;
            margin-bottom: 5px;
        }
        a {
            color: #0000ee;
            text-decoration: underline;
        }
        a:visited {
            color: #551a8b;
        }
        input[type="text"] {
            width: 70%;
            padding: 5px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #000;
        }
        input[type="submit"] {
            padding: 5px 10px;
            font-family: monospace;
            font-size: 14px;
            background: #efefef;
            border: 1px solid #000;
            cursor: pointer;
        }
        .nav {
            margin-top: 15px;
            font-size: 14px;
        }
        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div style="margin-bottom: 12px;">
        <img src="/logo.png" alt="ChickSearch Mascot" width="90" style="image-rendering: pixelated;">
    </div>
    <h1>ChickSearch</h1>
    <p>Search engine for the classic web.</p>

    <!-- Form Search -->
    <form action="/search" method="GET" onsubmit="attachHomeParams(this)">
        <input type="text" name="q" placeholder="type here..." required autofocus>
        <input type="hidden" name="safe" id="homeSafeInput" value="1">
        <input type="hidden" name="lite" id="homeLiteInput" value="0">
        <input type="submit" value="Search">
    </form>

    <script>
        function attachHomeParams(form) {
            const isSafe = localStorage.getItem('chick_safesearch') !== 'false';
            const isLite = localStorage.getItem('chick_litesearch') === 'true';
            form.querySelector('#homeSafeInput').value = isSafe ? '1' : '0';
            form.querySelector('#homeLiteInput').value = isLite ? '1' : '0';
        }
    </script>

    <!-- Menu Navigasi Ala Wiby -->
    <div class="nav">
        <a href="/surprise">Surprise Me</a> | 
        <a href="/status">System Status</a>
        <a href="/settings">Settings</a>
    </div>

    <div class="footer">
        <hr style="border: 0; border-top: 1px solid #ccc;">
        <p>ChickSearch Web Portal Engine &copy; 2026</p>
    </div>

</body>
</html>
